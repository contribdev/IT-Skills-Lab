apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name}}-deployment
  labels:
    app: {{ .Release.Name}}-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      project: {{ .Release.Name}}-deployment
  template:
    metadata:
      labels:
        project: {{ .Release.Name}}-deployment
    spec:
      containers:
        - name: {{ .Release.Name}}-deployment-web
          image: {{ .Values.container.image }}
          ports:
            - containerPort: 80
   