apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-autoscaling
  labels:
    app: my-k8s-web-app
    env: my-var
    owner: cheaster
spec:
  replicas: 2
  selector:
    matchLabels:
      project: dps
  template:
    metadata:
      labels:
        project: dps
    spec:
      containers:
        - name: dps-web
          image: nginx:1.27.0
          ports:
            - containerPort: 80
            

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-web-autoscaling
  minReplicas: 3
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
