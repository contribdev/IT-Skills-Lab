name: Build and Push LLM Worker

on:
  push:
    branches: [main]
    paths:
      - 'ai-document-platform/apps/llm-worker/**'
      - 'ai-document-platform/charts/llm-worker/templates/**'
      - 'ai-document-platform/charts/llm-worker/Chart.yaml'
      - 'ai-document-platform/charts/llm-worker/values.yaml'
      - '.github/workflows/build-llm-worker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-document-platform-llm-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ai-document-platform/apps/llm-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Update image tag in values.yaml
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd ai-document-platform/charts/llm-worker
          sed -i "s|tag: .*|tag: \"sha-${SHORT_SHA}\"|" values.yaml
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-document-platform/charts/llm-worker/values.yaml
          git diff --staged --quiet || git commit -m "chore(llm): bump image to sha-${SHORT_SHA} [skip ci]"
          git push