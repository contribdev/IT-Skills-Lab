apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocr-worker.fullname" . }}
  labels:
    {{- include "ocr-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ocr-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port | default 9090 }}
      targetPort: metrics
      protocol: TCP