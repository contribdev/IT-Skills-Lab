image:
  repository: ghcr.io/contribdev/ai-document-platform-ocr-worker
  tag: "sha-e96f72d"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  API_PORT: "8080"

  S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
  S3_BUCKET: "documents"
  S3_REGION: "us-east-1"

  OCR_QUEUE: "ocr.queue"
  LLM_QUEUE: "llm.queue"
  PREFETCH_COUNT: "1"
  
  OCR_LANGUAGES: "rus+eng"
  OCR_DPI: "300"
  OCR_TIMEOUT_SECONDS: "120"
  OCR_MAX_PAGES: "50"

  DB_POOL_MIN_SIZE: "2"
  DB_POOL_MAX_SIZE: "5"
  DB_COMMAND_TIMEOUT: "60.0"

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  name: ""
  annotations: {}

metrics:
  port: 9090
  enabled: true  

nodeSelector: {}
tolerations: []
affinity: {}
