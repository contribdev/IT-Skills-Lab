image:
  repository: ghcr.io/contribdev/ai-document-platform-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

config:
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  API_PORT: "8080"

  S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
  S3_BUCKET: "documents"
  S3_REGION: "us-east-1"

  OCR_QUEUE: "ocr.queue"

  MAX_UPLOAD_SIZE_MB: "50"
  DB_POOL_MIN_SIZE: "2"
  DB_POOL_MAX_SIZE: "10"
  DB_COMMAND_TIMEOUT: "30.0"

secrets:
  DATABASE_URL: ""
  RABBITMQ_URL: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
