apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: api-proxy
  namespace: ai-doc-platform
spec:
  virtualhost:
    fqdn: documents.local
    tls:
      secretName: documents-local-tls
  routes:
    - conditions:
        - prefix: /
      services:
        - name: api
          port: 8080