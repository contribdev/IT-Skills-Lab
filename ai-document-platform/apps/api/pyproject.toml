[project]
name = "api"
version = "0.1.0"
description = "AI Document Intelligence Platform — API Service"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",

    # S3
    "aioboto3>=13.2.0",

    # RabbitMQ
    "aio-pika>=9.5.0",

    # HTTP (для будущих вызовов)
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.4.0",

    # Metrics
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utilities
    "python-multipart>=0.0.12",   # для приёма файлов через FastAPI
    "uuid6>=2024.7.10",           # UUIDv7 для id
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]