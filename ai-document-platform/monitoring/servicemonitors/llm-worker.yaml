apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-worker
  namespace: ai-doc-platform
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s